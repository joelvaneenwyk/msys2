# https://taskfile.dev

version: "3"

tasks:
  default:
    cmds:
      - task: build

  build:
    cmds:
      - cmd: 'git -C "{{ .TASKFILE_DIR }}" add .'
      - task: docker-build-base

  docker-build:
    requires:
      vars: ["IMAGE_NAME"]
    vars:
      IMAGE_NAME: '{{ .IMAGE_NAME | default "joelvaneenwyk/msys2" }}'
      DOCKERFILE: '{{ .DOCKERFILE | default "Dockerfile" }}'
    cmds:
      - cmd: 'docker build --tag "{{ .IMAGE_NAME }}" --file "{{ .TASKFILE_DIR }}\{{ .DOCKERFILE }}" "{{ .TASKFILE_DIR }}"'

  docker-build-base:
    cmds:
      - task: docker-build
        vars:
          IMAGE_NAME: joelvaneenwyk/msys2
          DOCKERFILE: dockerfile.base

  docker-build-full:
    cmds:
      - task: docker-build
        vars:
          IMAGE_NAME: joelvaneenwyk/msys2
          DOCKERFILE: dockerfile.full

  docker-push:
    cmds:
      - task: docker-build-full
      - cmd: 'docker push "{{ .IMAGE_NAME }}"'
      - cmd: 'docker run -it --rm --name "{{ .CONTAINER_NAME }}" -v "/nfs:/nfs:shared" -v "{{ fromSlash .TASKFILE_DIR }}:C:/Users/ContainerAdministrator/workspace" "{{ .IMAGE_NAME }}"'

  up:
    cmds:
      - docker-compose down
      - docker-compose up --detach
      - docker-compose exec msys2 cmd
